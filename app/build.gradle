plugins { id 'com.android.application' version '9.2.1' }
android {
    namespace 'vn.jovi.assistant'
    compileSdk { version = release(36) { minorApiLevel = 1 } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'vn.jovi.assistant'
        minSdk 29
        targetSdk 36
        versionCode 12
        versionName '1.2'
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}

def wakeModelDir = layout.buildDirectory.dir('generated/wake-model/assets')
def prepareModel = { String taskName, String asset, String model, String expected ->
    tasks.register(taskName) {
        def modelFile = wakeModelDir.map { it.file(asset) }
        outputs.file(modelFile)
        inputs.property('sha256', expected)
        doLast {
            def destination = modelFile.get().asFile
            def hash = { file ->
                java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
            }
            if (destination.isFile() && hash(destination) == expected) return
            destination.parentFile.mkdirs()
            def temporary = new File(destination.parentFile, asset + '.tmp')
            try {
                def connection = URI.create("https://alphacephei.com/vosk/models/${model}.zip").toURL().openConnection()
                connection.connectTimeout = 20000
                connection.readTimeout = 60000
                connection.inputStream.withCloseable { input ->
                    temporary.withOutputStream { output -> input.transferTo(output) }
                }
                if (hash(temporary) != expected) throw new GradleException("Model SHA-256 mismatch: ${model}")
                java.nio.file.Files.move(temporary.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                temporary.delete()
            }
        }
    }
}

android.sourceSets.main.assets.srcDir(wakeModelDir.get().asFile)
def prepareWakeModel = prepareModel('prepareWakeModel', 'wake-model.zip', 'vosk-model-small-en-us-0.15',
        '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498')
def prepareVietnameseModel = prepareModel('prepareVietnameseModel', 'voice-vi-model.zip', 'vosk-model-small-vn-0.4',
        'efe5c8494212110471a79befc48c79da679e5b1fc52a4ffb500222ff86d622e5')
tasks.named('preBuild').configure { dependsOn(prepareWakeModel, prepareVietnameseModel) }
